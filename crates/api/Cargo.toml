[package]
name = "atlas-api"
edition.workspace = true
version.workspace = true

[dependencies]
argon2 = "0.6.0"
atlas-domain = { path = "../domain" }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
postgresql_embedded = "0.22.0"
tower = "0.5.3"
